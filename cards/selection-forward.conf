# Required-detector names are case-insensitive, comma separated
# Example: Forward.RequireDet: MCH,MID selects only MCH+MID matched tracks
# Available: ITS, TPC, TRD, TOF, MFT, MCH, MID
# VetoDet: reject any track with at least one listed detector

Selection.Mode: bc
Selection.Candidates: 10
Selection.Dataframe:
Selection.BCMin: -1
Selection.BCMax: -1

# Only meaningful in collision mode
Collision.Contributors.Min: 2
Collision.Contributors.Max: 10000

# Accepted-track multiplicities AFTER the independent track-level cuts
Tracks.Total.Min: 2
Tracks.Total.Max: 50
Tracks.Barrel.Min: 0
Tracks.Barrel.Max: 0
Tracks.Forward.Min: 2
Tracks.Forward.Max: 2

Barrel.Pt.Min: 0.15
Barrel.Pt.Max: 10000
Barrel.Eta.Min: -1
Barrel.Eta.Max: 1
Barrel.RequireDet: ITS,TPC
Barrel.VetoDet:
Barrel.RequirePVContributor: 1

Forward.Pt.Min: 0.5
Forward.Pt.Max: 10000
Forward.Eta.Min: -4.0
Forward.Eta.Max: -2.5
Forward.RequireDet: MCH,MID
Forward.VetoDet:

# Central trajectories: accumulated geometric distance
Barrel.MaxLengthCm: 600
Barrel.MaxChordCm: 10
